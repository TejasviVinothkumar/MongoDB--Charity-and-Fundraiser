<!DOCTYPE html>
<html>
<head>
    <title>Edit Campaign</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Edit Campaign</h1>

<form method="POST">

    <input type="text"
           name="title"
           value="{{ campaign.title }}"
           required>

    <textarea name="description">
{{ campaign.description }}
    </textarea>

    <input type="number"
           name="goal"
           value="{{ campaign.goal }}"
           required>

    <button type="submit">Update Campaign</button>

</form>

</body>
</html>
